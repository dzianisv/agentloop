name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify the packed CLI
        run: |
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          npm install --prefix "$RUNNER_TEMP/agentloop-consumer" "$RUNNER_TEMP/$TARBALL"
          "$RUNNER_TEMP/agentloop-consumer/node_modules/.bin/agentloop" --self-test
      - run: npm publish --access public
